apply plugin: 'com.android.library'

android {
    compileSdk = (findProperty('compileSdk') ?: 34) as Integer

    namespace "com.kezong.demo.libaar2"

    defaultConfig {
        minSdk = (findProperty('minSdk') ?: 16) as Integer
        targetSdk = (findProperty('targetSdk') ?: 34) as Integer
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        dataBinding = true
    }

    flavorDimensions = [ "default2"]

    productFlavors {
        flavor4 {
        }

        flavor3 {
        }
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

apply plugin: 'com.android.library'
apply plugin: 'com.kezong.fat-aar'
if (!rootProject.ext.agpVersion.startsWith('9.')) {
    apply plugin: 'kotlin-android'
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

android {
    compileSdk = (findProperty('compileSdk') ?: 34) as Integer

    namespace "com.kezong.demo.lib"

    defaultConfig {
        minSdk = (findProperty('minSdk') ?: 16) as Integer
        targetSdk = (findProperty('targetSdk') ?: 34) as Integer
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions = ["default"]

    productFlavors {
        flavor1 {
            missingDimensionStrategy 'default2', 'flavor3'
        }

        flavor2 {
            missingDimensionStrategy 'default2', 'flavor3'
        }
    }

    packaging {
        jniLibs {
            excludes += ['lib/x86/*.so', 'lib/x86_64/*.so', 'lib/armeabi/*.so', 'lib/arm64-v8a/*.so']
        }
    }

    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }
}

// for app test, copy the final aar to application libs without old AGP variant APIs
tasks.matching { it.name.startsWith('bundle') && it.name.endsWith('Aar') }.configureEach { bundleTask ->
    bundleTask.doLast {
        File outputFile = bundleTask.archiveFile.get().asFile
        if (outputFile.exists()) {
            copy {
                from outputFile
                into "../app/libs"
                rename outputFile.name, "fat-aar-final.aar"
            }
        }
    }
}

fataar {
    /**
     * If transitive is true, local jar module and remote library's dependencies will be embed.
     * If transitive is false, just embed first level dependency
     * Local aar project does not support transitive, always embed first level
     * Default value is false
     * @since 1.3.0
     */
    transitive = true
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    // java dependency
    embed project(path: ':lib-java', configuration: 'default')
    // aar dependency
    embed project(path: ':lib-aar', configuration: 'default')
    // aar dependency
    embed project(path: ':lib-aar2', configuration: 'default')
    // local full aar dependency, just build in flavor1
    flavor1Embed project(path: ':lib-aar-local', configuration: 'default')
    // local full aar dependency, just build in debug
    debugEmbed (name:'lib-aar-local2', ext:'aar')
    // remote dependency
    implementation 'com.google.guava:guava:20.0'
    // remote aar dependency
    embed ('com.facebook.fresco:fresco:1.12.0') {
        // exclude any group or module
        // exclude(group:'com.facebook.soloader', module:'soloader')
    }
    // remote aar dependency
    embed ('com.github.bumptech.glide:glide:4.11.0') {
        // If transitive = false, it will not embed dependencies declared in pom.xml
        // If fataar.transitive = false, There is no need to declare.
        transitive = false
    }
    // don't want to embed in
    implementation('androidx.appcompat:appcompat:1.6.1')
}

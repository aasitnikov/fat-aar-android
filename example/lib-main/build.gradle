apply plugin: 'com.android.library'
apply plugin: 'com.kezong.fat-aar'

import com.android.build.api.artifact.SingleArtifact
import com.android.build.api.variant.AndroidComponentsExtension

repositories {
    flatDir {
        dirs 'libs'
    }
}

android {
    compileSdkVersion = 34

    namespace "com.kezong.demo.lib"

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions = ["default"]

    productFlavors {
        flavor1 {
            missingDimensionStrategy 'default2', 'flavor3'
        }

        flavor2 {
            missingDimensionStrategy 'default2', 'flavor3'
        }
    }

    packagingOptions {
        exclude 'lib/x86/*.so'
        exclude 'lib/x86_64/*.so'
        exclude 'lib/armeabi/*.so'
        exclude 'lib/arm64-v8a/*.so'
    }

    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }
}

// for app test, copy the final aar to application libs. The assemble<Variant> lifecycle
// task isn't registered yet while onVariants runs, so only capture the AAR provider there
// and defer the tasks.named(...) lookup to afterEvaluate.
def aarProviders = [:]
AndroidComponentsExtension androidComponents = extensions.getByType(AndroidComponentsExtension)
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    aarProviders[variant.name] = variant.artifacts.get(SingleArtifact.AAR.INSTANCE)
}

afterEvaluate {
    aarProviders.each { variantName, aarProvider ->
        tasks.named("assemble${variantName.capitalize()}").configure {
            doLast {
                copy {
                    from aarProvider.get().asFile
                    into "../app/libs"
                    rename { "fat-aar-final.aar" }
                }
            }
        }
    }
}

fataar {
    /**
     * If transitive is true, local jar module and remote library's dependencies will be embed.
     * If transitive is false, just embed first level dependency
     * Local aar project does not support transitive, always embed first level
     * Default value is false
     * @since 1.3.0
     *
     * fat-aar-android 1.4.6 changes this flag from an afterEvaluate callback
     * (embedConfigurations.each { it.transitive = true }). Under AGP 9, the new Variant API can
     * resolve `embed`/`*Embed` before that callback runs, and Gradle then rejects the late
     * mutation. Leave this false so the plugin's own afterEvaluate step never touches the
     * configurations, and set `isTransitive` on them ourselves below, while they're still
     * mutable.
     */
    transitive = false
}

configurations.configureEach {
    if (name == "embed" || name.endsWith("Embed")) {
        transitive = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    // java dependency
    embed project(path: ':lib-java', configuration: 'default')
    // aar dependency
    embed project(path: ':lib-aar', configuration: 'default')
    // aar dependency
    embed project(path: ':lib-aar2', configuration: 'default')
    // local full aar dependency, just build in flavor1
    flavor1Embed project(path: ':lib-aar-local', configuration: 'default')
    // local full aar dependency, just build in debug
    debugEmbed (name:'lib-aar-local2', ext:'aar')
    // remote dependency
    implementation 'com.google.guava:guava:20.0'
    // remote aar dependency
    embed ('com.facebook.fresco:fresco:1.12.0') {
        // exclude any group or module
        // exclude(group:'com.facebook.soloader', module:'soloader')
    }
    // remote aar dependency
    embed ('com.github.bumptech.glide:glide:4.11.0') {
        // If transitive = false, it will not embed dependencies declared in pom.xml
        // If fataar.transitive = false, There is no need to declare.
        transitive = false
    }
    // don't want to embed in
    implementation('androidx.appcompat:appcompat:1.6.1')
}


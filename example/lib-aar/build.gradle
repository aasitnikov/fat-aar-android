apply plugin: 'com.android.library'
if (!rootProject.ext.agpVersion.startsWith('9.')) {
    apply plugin: 'kotlin-android'
    apply plugin: 'kotlin-kapt'
}

android {
    compileSdk = (findProperty('compileSdk') ?: 34) as Integer

    namespace "com.kezong.demo.libaar"

    defaultConfig {
        minSdk = (findProperty('minSdk') ?: 16) as Integer
        targetSdk = (findProperty('targetSdk') ?: 34) as Integer
        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding = true
    }

    flavorDimensions = ["default"]

    productFlavors {

        flavor1 {

        }

        flavor2 {

        }
    }

    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }
}

tasks.matching { it.name.startsWith('bundle') && it.name.endsWith('Aar') }.configureEach { bundleTask ->
    if (bundleTask.hasProperty('archiveFileName')) {
        String variantName = bundleTask.name.substring('bundle'.length(), bundleTask.name.length() - 'Aar'.length())
        bundleTask.archiveFileName.set("change-name-lib-aar-${variantName}.aar")
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
}

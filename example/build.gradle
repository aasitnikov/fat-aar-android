buildscript {
    ext.agpVersion = findProperty('agpVersion') ?: '8.13.0'
    ext.kotlinVersion = findProperty('kotlinVersion') ?: '2.2.21'

    repositories {
        mavenLocal()
        mavenCentral()
        google()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${agpVersion}"
        classpath "com.github.abdallahFc:fat-aar-android:${findProperty('fataarVersion') ?: '1.5.0'}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
